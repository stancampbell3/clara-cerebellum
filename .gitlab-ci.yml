stages:
  - test

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

.build_deps: &build_deps
  # Same native deps as docker/Dockerfile's builder stage:
  #   cmake/ninja/build-essential - CLIPS (cc crate) + SWI-Prolog (cmake) builds
  #   libssl-dev/pkg-config       - reqwest
  #   libgmp-dev/zlib1g-dev/libpcre2-dev - SWI-Prolog deps
  - apt-get update && apt-get install -y --no-install-recommends
    cmake ninja-build build-essential libssl-dev pkg-config
    libgmp-dev zlib1g-dev libpcre2-dev python3 git
    && rm -rf /var/lib/apt/lists/*

cargo-test:
  stage: test
  image: rust:latest
  cache:
    key: cargo-cache
    paths:
      - .cargo/
      - target/
  before_script:
    - *build_deps
  script:
    - cargo test --workspace
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

cargo-clippy:
  stage: test
  image: rust:latest
  cache:
    key: cargo-cache
    paths:
      - .cargo/
      - target/
  before_script:
    - *build_deps
    - rustup component add clippy
  script:
    - cargo clippy --workspace --all-targets
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
  # clippy was never enforced before (the old GitHub Actions workflows were
  # empty stubs), so this run surfaced pre-existing `not_unsafe_ptr_arg_deref`
  # errors in clara-coire's CLIPS FFI bridge (clips_bridge.rs). Marking those
  # functions `unsafe` is a real API/safety decision for the crate owner, not
  # something to guess at here — non-blocking until that's triaged.
  allow_failure: true
