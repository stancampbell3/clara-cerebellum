stages:
  - test

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

.build_deps: &build_deps
  # Same native deps as docker/Dockerfile's builder stage:
  #   cmake/ninja/build-essential - CLIPS (cc crate) + SWI-Prolog (cmake) builds
  #   libssl-dev/pkg-config       - reqwest
  #   libgmp-dev/zlib1g-dev/libpcre2-dev - SWI-Prolog deps
  - apt-get update && apt-get install -y --no-install-recommends
    cmake ninja-build build-essential libssl-dev pkg-config
    libgmp-dev zlib1g-dev libpcre2-dev python3 git
    && rm -rf /var/lib/apt/lists/*

cargo-test:
  stage: test
  image: rust:latest
  cache:
    # Cargo registry only — not target/. target/ has ~35k small object files
    # (CLIPS/SWI-Prolog/Rust build artifacts); archiving/extracting it cost
    # ~5min round-trip for marginal benefit, since a fresh git checkout resets
    # mtimes and partially invalidates cargo's incremental fingerprints anyway.
    # The registry cache is what actually matters: it avoids re-downloading
    # every dependency from crates.io on each run.
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
  before_script:
    - *build_deps
  script:
    - cargo test --workspace
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

cargo-clippy:
  stage: test
  image: rust:latest
  cache:
    # Cargo registry only — not target/. target/ has ~35k small object files
    # (CLIPS/SWI-Prolog/Rust build artifacts); archiving/extracting it cost
    # ~5min round-trip for marginal benefit, since a fresh git checkout resets
    # mtimes and partially invalidates cargo's incremental fingerprints anyway.
    # The registry cache is what actually matters: it avoids re-downloading
    # every dependency from crates.io on each run.
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
  before_script:
    - *build_deps
    - rustup component add clippy
  script:
    - cargo clippy --workspace --all-targets
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
  # Triaged 2026-09-22 (docs/clara_coire_ffi_unsafe_review.md): the pre-existing
  # `not_unsafe_ptr_arg_deref` errors in clara-coire's CLIPS FFI bridge are fixed
  # (the 5 flagged functions marked `unsafe fn`, plus the structurally-identical
  # ones in clara-ritual/clara-toolbox that clippy happened not to flag). Clean
  # now, so this is blocking again.
