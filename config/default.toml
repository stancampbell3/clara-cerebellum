[server]
host = "0.0.0.0"
port = 8080
request_timeout_ms = 30000
max_request_body_size = 1048576  # 1MB
# kafka_bootstrap = "localhost:9092"   # uncomment to enable rskafka-backed Rituals
fierypit_registration_ttl_seconds = 90  # GET /fierypits excludes registrations not refreshed within this window

[clips]
binary_path = "./clips/binaries/clips"
handshake_timeout_ms = 5000
default_eval_timeout_ms = 2000
sentinel_marker = "__END__"

[sessions]
max_concurrent = 100
max_per_user = 10
eviction_policy = "lru"
default_ttl_seconds = 3600

[resources]
max_facts_per_session = 1000
max_rules_per_session = 500
max_memory_mb = 128
max_eval_queue_depth = 10

[security]
deny_list = ["system", "load", "save", "open", "close"]
allow_list_mode = false
allowed_file_paths = ["./clips/rules"]

[persistence]
enabled = false
storage_backend = "filesystem"
storage_path = "./data/sessions"
compression = "gzip"
encryption = true
# Coire persistent store — uncomment and set a path to enable.
coire_store_path = "./data/coire.duckdb"
coire_store_ttl_seconds = 86400          # 24 hours; set to 0 to disable orphan sweep
coire_store_sweep_interval_seconds = 3600 # sweep every hour
deduction_snapshot_ttl_seconds = 604800  # 7 days; set to 0 to keep snapshots indefinitely
evaluate_cache_ttl_seconds = 30       # 30 seconds; set to 0 to disable TTL eviction of evaluate cache
# AppState.deductions (in-memory, every /deduce call, unconditionally — unlike
# the CoireStore-backed settings above) has no eviction at all without this;
# see PersistenceConfig's own doc comment for why this is a separate, smaller
# TTL than deduction_snapshot_ttl_seconds, not the durable archive.
deduction_entry_ttl_seconds = 3600            # 1 hour; set to 0 to disable this sweep
deduction_entry_sweep_interval_seconds = 300  # sweep every 5 minutes
# Wall-clock bound on a /deduce (ritual_properties_spec.md P1). A request's own
# deadline_ms wins over the default, and the ceiling clamps both. 0 disables.
deduction_default_deadline_seconds = 3600     # 1 hour when a request sets none
deduction_max_deadline_seconds = 14400        # 4 hour ceiling on any deadline
# Kafka topic reaper: Dis deletes a terminated Ritual's topic after this grace
# (participants notice the terminated state on poll and detach first).
ritual_topic_grace_seconds = 600              # 10 minutes; 0 disables the reaper
ritual_topic_sweep_interval_seconds = 300     # sweep every 5 minutes
ritual_topic_reap_orphans = true              # also delete ritual topics the registry does not know

[observability]
log_level = "info"
metrics_enabled = true
metrics_port = 9090
tracing_enabled = true
tracing_endpoint = "http://localhost:4317"

[auth]
jwt_secret = "${JWT_SECRET}"
token_expiry_seconds = 3600
