[company]
name = "Clara"
agent_name = "Clara"
greeting = "Hi! I'm Clara, a general-purpose assistant that learns as we talk. Ask me anything — if I don't already know, I'll go research it."

[server]
port = 8088

[paths]
# lildaemon's own base URL — hosts both FieryPit and the assistant REST API
# (goat/app/assistant/) this frontend talks to. In Docker, service names
# resolve via the clara-net bridge network.
fiery_pit_url = "http://lildaemon:6666"
static_path   = "/app/static"

[log]
level = "debug"
format = "[${timestamp}] ${target} - ${message}"
