<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clara — Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<script src="vendor/highlight.min.js" defer></script>
<script src="vendor/marked.min.js" defer></script>
<script src="vendor/purify.min.js" defer></script>
<script src="vendor/viz.js" defer></script>
<script src="vendor/full.render.js" defer></script>
<style>
  :root {
    --bg:           #0d0d0d;
    --surface:      #1a1010;
    --border:       #3d1a1a;
    --ember:        #c0392b;
    --ember-lo:     #7b1a1a;
    --ash:          #8a8a8a;
    --bone:         #d4c8b8;
    --agent-fill:   rgba(22, 10, 10, 0.93);
    --agent-border: #7b1a1a;
    --user-fill:    rgba(8, 20, 38, 0.93);
    --user-border:  #1a3a5a;
    --admitted:     #1a4a1a;
    --denied:       #4a1a1a;
    --redirect:     #2a2a1a;
    --font-body:    "IM Fell English", Georgia, serif;
    --font-head:    "Cinzel", Georgia, serif;
    --font-deco:    "Cinzel Decorative", Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--bone);
    font-family: var(--font-body);
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ───────────────────────────────────────────────────────────── */

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    font-family: var(--font-head);
    position: relative;
    z-index: 10;
  }

  header h1 {
    font-size: 1.05rem;
    color: var(--ember);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #status-badge {
    margin-left: auto;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-family: var(--font-head);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    border: 1px solid var(--border);
    background: #111;
    color: var(--ash);
    transition: background 0.4s, color 0.4s;
  }

  #status-badge.admitted   { background: var(--admitted); color: #7effa0; border-color: #3a8a3a; }
  #status-badge.denied     { background: var(--denied);   color: #ff9090; border-color: #8a3a3a; }
  #status-badge.redirected { background: var(--redirect); color: #ffd070; border-color: #8a7a3a; }
  #status-badge.active     { color: var(--bone); }

  #ruleset-select {
    background: #111;
    border: 1px solid var(--border);
    color: var(--bone);
    font-family: var(--font-head);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    outline: none;
  }
  #ruleset-select:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Research-update notification queue ──────────────────────────────── */

  #research-bell {
    position: relative;
    background: none;
    border: none;
    color: var(--bone);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.15rem 0.4rem;
  }
  #research-bell[hidden] { display: none; }

  #research-badge-count {
    position: absolute;
    top: -2px;
    right: -4px;
    background: var(--ember);
    color: #fff;
    font-size: 0.62rem;
    font-family: var(--font-head);
    border-radius: 999px;
    min-width: 15px;
    height: 15px;
    line-height: 15px;
    text-align: center;
    padding: 0 3px;
  }
  #research-badge-count[hidden] { display: none; }

  #research-panel {
    position: absolute;
    top: 2.6rem;
    right: 1rem;
    width: min(320px, 80vw);
    max-height: 60vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #research-panel[hidden] { display: none; }

  #research-panel .empty {
    padding: 0.9rem;
    color: var(--ash);
    font-size: 0.82rem;
    font-style: italic;
    text-align: center;
  }

  .research-item {
    padding: 0.65rem 0.8rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 0.82rem;
  }
  .research-item:last-child { border-bottom: none; }
  .research-item:hover { background: rgba(255,255,255,0.04); }
  .research-item .q {
    color: var(--ash);
    font-style: italic;
    margin-bottom: 0.2rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .research-item .cta { color: #ffd070; font-family: var(--font-head); font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; }

  .bubble.research-update {
    border-color: #7a6a2a;
  }
  .bubble.research-update::before { background: #7a6a2a; }

  /* ── In-progress indicator strip ─────────────────────────────────────── */
  /* Persistent (sessionStorage-backed, survives a reload) per-request
     chips for background work still running — distinct from the
     disposable .thinking pulse above, which only covers this turn's own
     synchronous classify/ack round trip. */

  #in-progress-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    padding: 0.4rem 1rem 0;
  }
  #in-progress-strip[hidden] { display: none; }

  .in-progress-chip {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.25rem 0.65rem;
    font-size: 0.72rem;
    color: var(--ash);
  }
  .in-progress-chip .icon { animation: pulse 1.2s infinite; }
  .in-progress-chip .q {
    max-width: 220px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--bone);
  }
  .in-progress-chip.kind-brainstorm { border-color: #7a5a2a; }
  .in-progress-chip.kind-deliberation { border-color: #2a5a7a; }
  .in-progress-chip.kind-research { border-color: var(--border); }

  /* ── Messages container — holds Minos bg + scrollable messages ──────── */

  #messages-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* Minos character background image */
  #minos-bg {
    position: absolute;
    bottom: 0;
    right: 0;
    width: min(46vw, 500px);
    height: 95%;
    object-fit: contain;
    object-position: bottom right;
    opacity: 0.48;
    transition: opacity 0.45s ease;
    pointer-events: none;
    z-index: 0;
    /* Soft fade on the left edge so text isn't fought over */
    -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.6) 18%, black 40%);
    mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.6) 18%, black 40%);
  }

  #minos-bg.fading { opacity: 0; }

  /* Subtle vignette over the whole messages area for depth */
  #messages-container::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 15% 50%, rgba(13,0,0,0.22) 0%, transparent 100%),
      linear-gradient(to bottom, rgba(13,0,0,0.35) 0%, transparent 18%, transparent 82%, rgba(13,0,0,0.35) 100%);
    pointer-events: none;
    z-index: 1;
  }

  #messages {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 1.2rem 1rem 1.2rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    z-index: 2;
  }

  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--ember-lo); border-radius: 2px; }

  /* ── Message wrapper (label + balloon) ──────────────────────────────── */

  .msg-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.22rem;
    max-width: 64%;
    animation: bubbleIn 0.22s ease-out both;
  }

  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)   scale(1);    }
  }

  .msg-wrap.agent { align-self: flex-start; align-items: flex-start; }
  .msg-wrap.user  { align-self: flex-end;   align-items: flex-end;   }

  .msg-label {
    font-family: var(--font-head);
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    padding: 0 0.55rem;
    user-select: none;
  }
  .msg-wrap.agent .msg-label { color: var(--ember); }
  .msg-wrap.user  .msg-label { color: #4a8ab8; }

  /* ── Speech balloons ─────────────────────────────────────────────────── */

  .bubble {
    position: relative;
    padding: 0.68rem 1rem;
    line-height: 1.6;
    font-size: 0.92rem;
    white-space: pre-wrap;
    overflow: visible; /* tails extend outside */
  }

  /* Agent balloon — rounded top-left = tail attachment point, tail on left */
  .bubble.agent {
    background: var(--agent-fill);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border: 1px solid var(--agent-border);
    border-radius: 2px 16px 16px 16px;
    color: var(--bone);
    margin-left: 15px;
  }

  /* Tail border layer (ember color) */
  .bubble.agent::before {
    content: '';
    position: absolute;
    top: 12px;
    left: -14px;
    width: 14px;
    height: 22px;
    background: var(--agent-border);
    clip-path: polygon(100% 0, 100% 100%, 0 50%);
  }

  /* Tail fill layer (matches bubble background) */
  .bubble.agent::after {
    content: '';
    position: absolute;
    top: 13px;
    left: -12px;
    width: 12px;
    height: 20px;
    background: rgba(22, 10, 10, 0.97);
    clip-path: polygon(100% 0, 100% 100%, 0 50%);
  }

  /* User balloon — rounded top-right = tail attachment point, tail on right */
  .bubble.user {
    background: var(--user-fill);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border: 1px solid var(--user-border);
    border-radius: 16px 2px 16px 16px;
    color: #b8c8d8;
    margin-right: 15px;
  }

  /* Tail border layer */
  .bubble.user::before {
    content: '';
    position: absolute;
    top: 12px;
    right: -14px;
    width: 14px;
    height: 22px;
    background: var(--user-border);
    clip-path: polygon(0 0, 0 100%, 100% 50%);
  }

  /* Tail fill layer */
  .bubble.user::after {
    content: '';
    position: absolute;
    top: 13px;
    right: -12px;
    width: 12px;
    height: 20px;
    background: rgba(8, 20, 38, 0.97);
    clip-path: polygon(0 0, 0 100%, 100% 50%);
  }

  /* ── Copy button (per-bubble) ─────────────────────────────────────────── */

  .bubble .copy-btn {
    position: absolute;
    top: 0.3rem;
    right: 0.4rem;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    color: var(--ash);
    font-size: 0.72rem;
    line-height: 1;
    padding: 0.2rem 0.35rem;
    border-radius: 3px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .bubble.user .copy-btn { right: auto; left: 0.4rem; }
  .bubble:hover .copy-btn,
  .bubble .copy-btn:focus-visible { opacity: 1; }
  .bubble .copy-btn.copied { color: #7effa0; opacity: 1; }
  .bubble .copy-btn.copy-failed { color: var(--ember); opacity: 1; }

  /* ── Code blocks ──────────────────────────────────────────────────────── */

  .bubble pre.code-block {
    margin: 0.5rem 0;
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow-x: auto;
    white-space: pre;
  }
  .bubble pre.code-block:first-child { margin-top: 0; }
  .bubble pre.code-block:last-child { margin-bottom: 0; }

  .code-block-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.25rem 0.6rem;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-head);
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ash);
  }

  .copy-code-btn,
  .diagram-toggle-btn {
    background: none;
    border: none;
    color: var(--ash);
    cursor: pointer;
    font-size: 0.75rem;
    line-height: 1;
    padding: 0.1rem 0.3rem;
  }
  .copy-code-btn:hover,
  .diagram-toggle-btn:hover { color: var(--bone); }
  .copy-code-btn.copied { color: #7effa0; }
  .copy-code-btn.copy-failed { color: var(--ember); }
  .diagram-toggle-btn.active { color: var(--bone); }

  .bubble pre.code-block code {
    display: block;
    padding: 0.6rem 0.8rem;
    font-family: "Courier New", Courier, monospace;
    font-size: 0.82rem;
    line-height: 1.5;
    white-space: pre;
  }

  code.inline-code {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.05rem 0.3rem;
    font-family: "Courier New", Courier, monospace;
    font-size: 0.88em;
  }

  /* ── Inline diagrams (SVG / DOT-graphviz code fences) ───────────────────── */

  .diagram-block {
    margin: 0.5rem 0;
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .diagram-block:first-child { margin-top: 0; }
  .diagram-block:last-child { margin-bottom: 0; }

  .diagram-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.25rem 0.6rem;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-head);
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ash);
  }
  .diagram-actions { display: flex; align-items: center; gap: 0.2rem; }

  .diagram-render {
    padding: 0.7rem;
    overflow: auto;
    text-align: center;
  }
  .diagram-render svg { max-width: 100%; height: auto; }
  .diagram-status,
  .diagram-error {
    font-size: 0.82rem;
    color: var(--ash);
    font-style: italic;
  }
  .diagram-error { color: var(--ember); }

  .diagram-source { margin: 0; border-top: 1px solid var(--border); }
  .diagram-source code {
    display: block;
    padding: 0.6rem 0.8rem;
    font-family: "Courier New", Courier, monospace;
    font-size: 0.82rem;
    line-height: 1.5;
    white-space: pre;
    overflow-x: auto;
  }

  /* ── Markdown block elements (headings, lists, quotes, tables) ──────────
     .bubble's own white-space: pre-wrap only matters for un-rendered text
     nodes; these are real elements now, so give them normal flow spacing
     instead of inheriting that. */
  .bubble :is(h1, h2, h3, h4, h5, h6) {
    margin: 0.7rem 0 0.35rem;
    line-height: 1.3;
    font-family: var(--font-head);
    color: var(--bone);
  }
  .bubble :is(h1, h2, h3, h4, h5, h6):first-child { margin-top: 0; }
  .bubble h1 { font-size: 1.15rem; }
  .bubble h2 { font-size: 1.08rem; }
  .bubble :is(h3, h4, h5, h6) { font-size: 1rem; }
  .bubble p { margin: 0.45rem 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble :is(ul, ol) { margin: 0.45rem 0; padding-left: 1.4rem; }
  .bubble li { margin: 0.15rem 0; }
  .bubble li > :is(ul, ol) { margin: 0.15rem 0; }
  .bubble blockquote {
    margin: 0.5rem 0;
    padding: 0.1rem 0.8rem;
    border-left: 3px solid var(--ember-lo);
    color: var(--ash);
  }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 0.7rem 0; }
  .bubble table { border-collapse: collapse; margin: 0.5rem 0; font-size: 0.88em; }
  .bubble :is(th, td) { border: 1px solid var(--border); padding: 0.25rem 0.55rem; }
  .bubble th { background: rgba(255,255,255,0.04); font-family: var(--font-head); }
  .bubble a { color: #7ea8d8; }
  .bubble a:hover { color: #a0c4ee; }

  /* highlight.js token colors, tuned to this page's ember/bone palette
     instead of importing an off-the-shelf theme */
  .hljs                 { color: var(--bone); background: none; }
  .hljs-comment,
  .hljs-quote            { color: var(--ash); font-style: italic; }
  .hljs-keyword,
  .hljs-selector-tag,
  .hljs-literal,
  .hljs-built_in,
  .hljs-name              { color: var(--ember); }
  .hljs-string,
  .hljs-attr,
  .hljs-symbol,
  .hljs-bullet             { color: #ffd070; }
  .hljs-number,
  .hljs-title,
  .hljs-type,
  .hljs-variable            { color: #4a8ab8; }
  .hljs-title.function_,
  .hljs-title.class_        { color: #7effa0; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong    { font-weight: bold; }

  /* System notes — no balloon */
  .system-note {
    align-self: center;
    color: var(--ash);
    font-size: 0.78rem;
    font-style: italic;
    max-width: 90%;
    text-align: center;
    padding: 0.15rem 0;
  }

  .thinking {
    align-self: flex-start;
    color: var(--ember-lo);
    font-size: 0.8rem;
    font-style: italic;
    padding-left: 1rem;
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  /* ── Footer ───────────────────────────────────────────────────────────── */

  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0.75rem 1rem;
    display: flex;
    align-items: flex-end;
    gap: 0.5rem;
    position: relative;
    z-index: 10;
  }

  #input {
    flex: 1;
    background: #0d0d0d;
    border: 1px solid var(--border);
    color: var(--bone);
    padding: 0.5rem 0.75rem;
    font-family: var(--font-body);
    font-size: 0.92rem;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
    min-height: 2.3rem;
    max-height: 40vh;
    overflow-y: auto;
    line-height: 1.4;
  }
  #input:focus { border-color: var(--ember-lo); }
  #input:disabled { opacity: 0.4; cursor: not-allowed; }

  #send-hint {
    align-self: center;
    color: var(--ash);
    font-size: 0.68rem;
    font-style: italic;
    white-space: nowrap;
  }

  #send-btn {
    background: var(--ember-lo);
    border: none;
    color: var(--bone);
    padding: 0.5rem 1rem;
    cursor: pointer;
    font-family: var(--font-head);
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    border-radius: 3px;
    transition: background 0.2s;
  }
  #send-btn:hover { background: var(--ember); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    border: 2px dashed var(--ember-lo);
    color: var(--bone);
    font-family: var(--font-head);
    font-size: 1.1rem;
    letter-spacing: 0.06em;
    pointer-events: none;
  }
  #drop-overlay.visible { display: flex; }

  #conn-indicator {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    margin-right: 0.25rem;
    display: inline-block;
    flex-shrink: 0;
    align-self: center;
  }
  #conn-indicator.open    { background: #4a8a4a; }
  #conn-indicator.closed  { background: #8a4a4a; }
  #conn-indicator.error   { background: var(--ember); }

  /* ── Outcome screen ──────────────────────────────────────────────────── */

  #outcome {
    display: none;
    position: fixed;
    inset: 0;
    background: #080808;
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
    text-align: center;
    animation: fadeIn 1s ease;
  }

  #outcome.visible { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #outcome-graphic {
    width: min(320px, 80vw);
    height: auto;
  }

  #outcome-verdict {
    font-family: var(--font-deco);
    font-size: clamp(1.6rem, 6vw, 3rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.2;
  }

  #outcome-verdict.admitted   { color: #7effa0; text-shadow: 0 0 40px #3a8a3a88; }
  #outcome-verdict.denied     { color: #ff7070; text-shadow: 0 0 40px #8a3a3a88; }
  #outcome-verdict.redirected { color: #ffd070; text-shadow: 0 0 40px #8a7a3a88; }

  #outcome-reason {
    font-family: var(--font-body);
    font-style: italic;
    font-size: clamp(0.85rem, 2.5vw, 1.05rem);
    color: var(--ash);
    max-width: 520px;
    line-height: 1.6;
  }

  #outcome-where {
    font-family: var(--font-head);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ffd070;
  }

  #outcome-seal {
    margin-top: 1rem;
    font-family: var(--font-head);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #333;
  }

  /* ── Login screen ────────────────────────────────────────────────────── */

  #login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 2rem;
  }

  #login-screen.hidden { display: none; }

  #login-title {
    font-family: var(--font-deco);
    color: var(--ember);
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  #login-form {
    display: flex;
    gap: 0.5rem;
  }

  #login-username {
    background: #0d0d0d;
    border: 1px solid var(--border);
    color: var(--bone);
    padding: 0.55rem 0.8rem;
    font-family: var(--font-body);
    font-size: 0.95rem;
    border-radius: 3px;
    outline: none;
    min-width: 220px;
  }
  #login-username:focus { border-color: var(--ember-lo); }

  #login-submit {
    background: var(--ember-lo);
    border: none;
    color: var(--bone);
    padding: 0.55rem 1.1rem;
    cursor: pointer;
    font-family: var(--font-head);
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    border-radius: 3px;
  }
  #login-submit:hover { background: var(--ember); }
  #login-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  #login-error {
    color: #ff9090;
    font-size: 0.85rem;
    min-height: 1.2em;
  }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-title">Who goes there?</div>
  <form id="login-form">
    <input id="login-username" type="text" placeholder="Enter a name…" autocomplete="off" maxlength="32" required>
    <button id="login-submit" type="submit">Enter</button>
  </form>
  <div id="login-error"></div>
</div>

<header>
  <span id="conn-indicator" title="Connection status"></span>
  <h1>Clara — Assistant</h1>
  <select id="ruleset-select" disabled title="Active ruleset"></select>
  <button id="research-bell" hidden title="Research updates">
    🔔<span id="research-badge-count" hidden>0</span>
  </button>
  <div id="research-panel" hidden></div>
  <span id="status-badge">connecting…</span>
</header>

<div id="messages-container">
  <img id="minos-bg" src="minos_collat/minos_rest.png" alt="" aria-hidden="true">
  <div id="messages"></div>
</div>

<div id="in-progress-strip" hidden></div>

<div id="drop-overlay">📎 Drop file to attach</div>

<footer>
  <textarea id="input" rows="1" placeholder="State your business…" disabled autocomplete="off"></textarea>
  <span id="send-hint">Ctrl+Enter to send</span>
  <button id="send-btn" disabled>Submit</button>
</footer>

<!-- Outcome screen — shown on terminal WS message -->
<div id="outcome" role="dialog" aria-modal="true">
  <div id="outcome-graphic" aria-hidden="true"></div>
  <div id="outcome-verdict"></div>
  <p id="outcome-reason"></p>
  <p id="outcome-where" style="display:none"></p>
  <p id="outcome-seal">City of Dis — Administrative Record</p>
</div>

<script>
  const messages      = document.getElementById('messages');
  const input         = document.getElementById('input');
  const sendBtn       = document.getElementById('send-btn');
  const badge         = document.getElementById('status-badge');
  const connDot       = document.getElementById('conn-indicator');
  const outcome       = document.getElementById('outcome');
  const minosBg       = document.getElementById('minos-bg');
  const rulesetSelect = document.getElementById('ruleset-select');
  const researchBell  = document.getElementById('research-bell');
  const researchCount = document.getElementById('research-badge-count');
  const researchPanel = document.getElementById('research-panel');
  const inProgressStrip = document.getElementById('in-progress-strip');

  let ws;
  let pendingResearch = loadPendingResearch(); // [{request_id, kind, query, reply, citation_count}], undelivered alerts
  let thinkingEl       = null;
  let agentName        = 'Clara';
  let currentMinosState = 'rest';

  // ── Minos image state machine ──────────────────────────────────────────────

  const MINOS_IMAGES = {
    rest:       'minos_collat/minos_rest.png',
    greet:      'minos_collat/minos_greet.png',
    explains:   'minos_collat/minos_explains.png',
    direct:     'minos_collat/minos_direct.png',
    disappoint: 'minos_collat/minos_disappoint.png',
    displeased: 'minos_collat/minos_displeased.png',
  };

  function pickMinosState(status, text) {
    if (status === 'admitted')   return 'greet';
    if (status === 'denied')     return 'displeased';
    if (status === 'redirected') return 'direct';
    if (!text) return currentMinosState;
    if (/cannot|not permitted|denied|refuse|forbidden|unauthorized|not allowed|regret|unfortunately|impossible/i.test(text)) {
      return 'disappoint';
    }
    if (/proceed|direct|report to|go to|escort|this way|make your way|you are to/i.test(text)) {
      return 'direct';
    }
    return 'explains';
  }

  function setMinosImage(state) {
    if (state === currentMinosState) return;
    currentMinosState = state;
    minosBg.classList.add('fading');
    setTimeout(() => {
      minosBg.src = MINOS_IMAGES[state] || MINOS_IMAGES.rest;
      minosBg.classList.remove('fading');
    }, 380);
  }

  // ── Gate SVG graphics ──────────────────────────────────────────────────────

  const GATE_OPEN = `<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow-g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <!-- pillars -->
    <rect x="10" y="30" width="30" height="160" fill="#2a1a0a" stroke="#8a6a3a" stroke-width="1.5"/>
    <rect x="200" y="30" width="30" height="160" fill="#2a1a0a" stroke="#8a6a3a" stroke-width="1.5"/>
    <!-- arch -->
    <path d="M40 30 Q120 -20 200 30" fill="none" stroke="#8a6a3a" stroke-width="3"/>
    <!-- open gates (swung back) -->
    <rect x="12" y="30" width="55" height="110" rx="2" fill="#1a0a00" stroke="#5a4a2a" stroke-width="1"
          transform="skewX(-30) translate(18,0)"/>
    <rect x="173" y="30" width="55" height="110" rx="2" fill="#1a0a00" stroke="#5a4a2a" stroke-width="1"
          transform="skewX(30) translate(-18,0)"/>
    <!-- glow path through gate -->
    <ellipse cx="120" cy="110" rx="50" ry="70" fill="#7effa022" filter="url(#glow-g)"/>
    <!-- crossing runes -->
    <text x="25" y="22" font-size="12" fill="#8a6a3a" font-family="serif">⚔</text>
    <text x="203" y="22" font-size="12" fill="#8a6a3a" font-family="serif">⚔</text>
  </svg>`;

  const GATE_BARRED = `<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow-r"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <!-- pillars -->
    <rect x="10" y="30" width="30" height="160" fill="#2a0a0a" stroke="#8a3a3a" stroke-width="1.5"/>
    <rect x="200" y="30" width="30" height="160" fill="#2a0a0a" stroke="#8a3a3a" stroke-width="1.5"/>
    <!-- arch -->
    <path d="M40 30 Q120 -20 200 30" fill="none" stroke="#8a3a3a" stroke-width="3"/>
    <!-- closed gate panels -->
    <rect x="42" y="32" width="76" height="130" rx="2" fill="#1a0808" stroke="#6a2a2a" stroke-width="1.5"/>
    <rect x="122" y="32" width="76" height="130" rx="2" fill="#1a0808" stroke="#6a2a2a" stroke-width="1.5"/>
    <!-- vertical bars -->
    <line x1="60"  y1="32" x2="60"  y2="162" stroke="#4a1a1a" stroke-width="2"/>
    <line x1="80"  y1="32" x2="80"  y2="162" stroke="#4a1a1a" stroke-width="2"/>
    <line x1="100" y1="32" x2="100" y2="162" stroke="#4a1a1a" stroke-width="2"/>
    <line x1="140" y1="32" x2="140" y2="162" stroke="#4a1a1a" stroke-width="2"/>
    <line x1="160" y1="32" x2="160" y2="162" stroke="#4a1a1a" stroke-width="2"/>
    <line x1="180" y1="32" x2="180" y2="162" stroke="#4a1a1a" stroke-width="2"/>
    <!-- horizontal bar / lock -->
    <rect x="42" y="90" width="156" height="12" fill="#3a1010" stroke="#8a3a3a" stroke-width="1.5"/>
    <rect x="105" y="84" width="30" height="24" rx="3" fill="#2a0808" stroke="#c0392b" stroke-width="2"/>
    <!-- ember glow on bars -->
    <line x1="120" y1="32" x2="120" y2="162" stroke="#c0392b44" stroke-width="8" filter="url(#glow-r)"/>
  </svg>`;

  const GATE_REDIRECT = `<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow-a"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <!-- pillars -->
    <rect x="10" y="30" width="30" height="160" fill="#1a1a0a" stroke="#7a6a2a" stroke-width="1.5"/>
    <rect x="200" y="30" width="30" height="160" fill="#1a1a0a" stroke="#7a6a2a" stroke-width="1.5"/>
    <path d="M40 30 Q120 -20 200 30" fill="none" stroke="#7a6a2a" stroke-width="3"/>
    <!-- partially ajar gate -->
    <rect x="42" y="32" width="76" height="130" rx="2" fill="#151508" stroke="#5a5a1a" stroke-width="1.5"
          transform="skewX(-8)"/>
    <rect x="122" y="32" width="76" height="130" rx="2" fill="#151508" stroke="#5a5a1a" stroke-width="1.5"/>
    <!-- direction arrow -->
    <g filter="url(#glow-a)">
      <line x1="60" y1="100" x2="180" y2="100" stroke="#ffd070" stroke-width="3"/>
      <polygon points="175,90 195,100 175,110" fill="#ffd070"/>
    </g>
    <text x="85" y="145" font-size="11" fill="#9a8a3a" font-family="serif" text-anchor="middle">This way</text>
  </svg>`;

  function showOutcome(status, text, reason, where_) {
    // Show last agent message first, then fade to outcome
    appendBubble('agent', text, agentName);

    setTimeout(() => {
      const verdict  = document.getElementById('outcome-verdict');
      const reasonEl = document.getElementById('outcome-reason');
      const whereEl  = document.getElementById('outcome-where');
      const graphic  = document.getElementById('outcome-graphic');

      if (status === 'admitted') {
        verdict.textContent  = 'Entry Granted';
        verdict.className    = 'admitted';
        graphic.innerHTML    = GATE_OPEN;
      } else if (status === 'redirected') {
        verdict.textContent  = 'You Have Been Redirected';
        verdict.className    = 'redirected';
        graphic.innerHTML    = GATE_REDIRECT;
      } else {
        verdict.textContent  = 'Entry Denied';
        verdict.className    = 'denied';
        graphic.innerHTML    = GATE_BARRED;
      }

      reasonEl.textContent = reason || '';

      if (where_ && where_.trim()) {
        whereEl.textContent = `Proceed to: ${where_}`;
        whereEl.style.display = '';
      } else {
        whereEl.style.display = 'none';
      }

      outcome.classList.add('visible');
    }, 1800);
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────

  function connect(token) {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    let url = `${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`;
    const existingSessionId = sessionStorage.getItem('clara_session_id');
    if (existingSessionId) {
      url += `&session_id=${encodeURIComponent(existingSessionId)}`;
    }
    ws = new WebSocket(url);

    ws.onopen = () => {
      connDot.className = 'open';
      badge.textContent = 'Active';
      badge.className   = 'active';
      input.disabled    = false;
      sendBtn.disabled  = false;
      input.focus();
      setMinosImage('greet');
    };

    ws.onmessage = (evt) => {
      removeThinking();
      let data;
      try { data = JSON.parse(evt.data); } catch { return; }

      if (data.type === 'agent') {
        appendBubble('agent', data.text, agentName);
        setStatus('active');
        setMinosImage(pickMinosState(data.status, data.text));
        if (ASYNC_ACTIONS[data.action_taken]) {
          addInProgressPlaceholder(data.action_taken, lastSentText);
        }
      } else if (data.type === 'terminal') {
        setStatus(data.status);
        disableInput();
        setMinosImage(pickMinosState(data.status, data.text));
        showOutcome(data.status, data.text, data.reason, data.where);
      } else if (data.type === 'error') {
        appendNote(data.text);
      } else if (data.type === 'session') {
        sessionStorage.setItem('clara_session_id', data.session_id);
      } else if (data.type === 'rulesets') {
        populateRulesets(data.rulesets);
      } else if (data.type === 'ruleset_set') {
        appendNote(`Switched to the "${labelFor(data.ruleset_key)}" ruleset.`);
      } else if (data.type === 'research_update') {
        addPendingResearch(data);
      } else if (data.type === 'research_status') {
        upsertInProgressFromServer(data);
      }
    };

    ws.onclose = () => {
      connDot.className = 'closed';
      disableInput();
      if (!outcome.classList.contains('visible')) {
        const terminalStatuses = ['admitted', 'denied', 'redirected'];
        if (!terminalStatuses.includes(badge.className)) {
          appendNote('Connection closed.');
          badge.textContent = 'Disconnected';
          badge.className   = '';
        }
      }
    };

    ws.onerror = () => {
      connDot.className = 'error';
      appendNote('Connection error. Refresh to retry.');
    };
  }

  function autoGrowInput() {
    input.style.height = 'auto';
    input.style.height = `${input.scrollHeight}px`;
  }

  let lastSentText = '';

  function send() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    appendBubble('user', text);
    input.value = '';
    autoGrowInput();
    showThinking();
    lastSentText = text;
    ws.send(JSON.stringify({ type: 'chat', text }));
  }

  // ── File attachment (drag & drop) ───────────────────────────────────────────
  //
  // Upload happens on drop, not on text-submit — async, out-of-band from the
  // WS chat channel. The uploaded file lands in the analyst's own workspace
  // and a system note referencing it (inlined, for small text files) is
  // injected into session history server-side, so the very next /send call
  // already carries it — no attachment field needed in the chat payload
  // itself (see lildaemon's POST /assistant/sessions/{id}/attachments).

  const dropOverlay = document.getElementById('drop-overlay');
  let dragDepth = 0;

  function chatIsActive() {
    return !!ws && ws.readyState === WebSocket.OPEN;
  }

  function hasFiles(e) {
    return !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  }

  window.addEventListener('dragover', (e) => {
    // preventDefault unconditionally (login screen included) so the browser
    // never navigates away to display the dropped file in place of the app.
    if (hasFiles(e)) e.preventDefault();
  });

  window.addEventListener('dragenter', (e) => {
    if (!chatIsActive() || !hasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    dropOverlay.classList.add('visible');
  });

  window.addEventListener('dragleave', () => {
    if (dragDepth === 0) return;
    dragDepth--;
    if (dragDepth === 0) dropOverlay.classList.remove('visible');
  });

  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove('visible');
    if (!chatIsActive()) return;
    Array.from(e.dataTransfer.files || []).forEach(uploadAttachment);
  });

  function formatBytes(n) {
    return n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`;
  }

  async function uploadAttachment(file) {
    const note = appendNote(`📎 Attaching "${file.name}" (${formatBytes(file.size)})…`);
    try {
      const sessionId = sessionStorage.getItem('clara_session_id');
      const token = sessionStorage.getItem('clara_token');
      if (!sessionId || !token) throw new Error('not connected yet');

      const form = new FormData();
      form.append('file', file, file.name);

      const resp = await fetch(`/upload?session_id=${encodeURIComponent(sessionId)}`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: form,
      });
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        throw new Error(body.error || `upload failed (${resp.status})`);
      }
      const result = await resp.json();
      note.textContent = result.inlined
        ? `📎 Attached "${result.filename}" (${formatBytes(result.size)}) — its contents are visible now.`
        : `📎 Attached "${result.filename}" (${formatBytes(result.size)}) — available for lookup if relevant.`;
    } catch (e) {
      note.textContent = `📎 Failed to attach "${file.name}": ${e.message || e}`;
    }
  }

  // ── Ruleset selection ───────────────────────────────────────────────────────

  let rulesetLabels = {};

  function labelFor(key) {
    return (rulesetLabels[key] && rulesetLabels[key].label) || key;
  }

  function populateRulesets(rulesets) {
    rulesetLabels = Object.fromEntries(rulesets.map(r => [r.ruleset_key, r]));
    rulesetSelect.innerHTML = '';
    for (const r of rulesets) {
      const opt = document.createElement('option');
      opt.value = r.ruleset_key;
      opt.textContent = r.label;
      opt.title = r.description;
      rulesetSelect.appendChild(opt);
    }
    rulesetSelect.disabled = false;
  }

  rulesetSelect.addEventListener('change', () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'set_ruleset', ruleset_key: rulesetSelect.value }));
  });

  // ── Research-update notification queue ──────────────────────────────────────
  //
  // A deferred_query/deliberate/brainstorm reply already answered the
  // question (an immediate ack, or a qualified "best answer so far"); this
  // is the FOLLOW-UP once the background work finishes. Deliberately NOT
  // auto-injected into the live transcript — arriving mid-conversation
  // would interrupt whatever the visitor is doing. It waits in this queue
  // until they open it.
  //
  // Persisted to sessionStorage (2026-09-13, id_ritual_of_rituals_planning.md
  // Part 2) so a reload doesn't lose a result: the server now sends a
  // 'ready' item on every tick until explicitly acked (see ws.rs), and
  // this client acks as soon as the item is written here — i.e. durability
  // comes first, viewing (the click-to-open bell) is a separate, later
  // step, same as it always was.

  function loadPendingResearch() {
    try {
      return JSON.parse(sessionStorage.getItem('clara_pending_research') || '[]');
    } catch { return []; }
  }

  function savePendingResearch() {
    try {
      sessionStorage.setItem('clara_pending_research', JSON.stringify(pendingResearch));
    } catch { /* private window / storage disabled — in-memory only, best effort */ }
  }

  function addPendingResearch(item) {
    // The server resends a 'ready' item on every tick until acked — dedupe
    // by request_id rather than accumulating duplicates.
    if (item.request_id && pendingResearch.some(p => p.request_id === item.request_id)) return;
    pendingResearch.push(item);
    savePendingResearch();
    renderResearchQueue();
    resolveInProgress(item.request_id, item.query);
    if (item.request_id && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'research_ack', request_id: item.request_id }));
    }
  }

  function renderResearchQueue() {
    researchBell.hidden = pendingResearch.length === 0;
    researchCount.hidden = pendingResearch.length === 0;
    researchCount.textContent = pendingResearch.length;

    researchPanel.innerHTML = '';
    if (pendingResearch.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No research updates waiting.';
      researchPanel.appendChild(empty);
      return;
    }
    pendingResearch.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'research-item';
      const q = document.createElement('div');
      q.className = 'q';
      q.textContent = item.query;
      const cta = document.createElement('div');
      cta.className = 'cta';
      cta.textContent = 'View fuller answer →';
      row.appendChild(q);
      row.appendChild(cta);
      row.addEventListener('click', () => deliverPendingResearch(idx));
      researchPanel.appendChild(row);
    });
  }

  function deliverPendingResearch(idx) {
    const item = pendingResearch[idx];
    if (!item) return;
    pendingResearch.splice(idx, 1);
    savePendingResearch();
    researchPanel.hidden = true;
    renderResearchQueue();
    appendBubble('agent', item.reply || '(no answer)', agentName, 'research-update');
  }

  researchBell.addEventListener('click', () => {
    researchPanel.hidden = !researchPanel.hidden;
  });

  // ── In-progress indicator ────────────────────────────────────────────────
  //
  // Persistent (sessionStorage-backed) chips for background work still
  // running — deferred_query/deliberate/brainstorm turns. Distinct from
  // the disposable .thinking pulse (showThinking/removeThinking), which
  // only spans this turn's own synchronous classify+ack round trip; this
  // spans the background deduction that continues after that ack, which
  // is now the common case for every "id" ruleset turn (always-on
  // brainstorm rollout).
  //
  // Keyed by request_id once known (from a research_status/research_update
  // frame). Before that — the moment a chat reply's own action_taken names
  // an async action — there is no request_id yet, so a placeholder keyed
  // by "q:<query text>" stands in; it's upgraded (deleted) once a real
  // request_id for that same query shows up, so only one chip is ever
  // shown for a given turn.

  // A stale entry can only happen if the browser was closed for the ENTIRE
  // lifetime of a background request (never saw its research_update, so
  // never acked, AND the row later failed server-side instead of staying
  // 'ready' forever) — the actor's own gone-row detection (ws.rs) can't
  // catch this because a fresh WS connection starts with no memory of
  // what a PRIOR connection was tracking. Rare; a wall-clock TTL prune on
  // load is a simple, sufficient backstop rather than a real protocol fix.
  const IN_PROGRESS_STALE_MS = 30 * 60 * 1000;

  let inProgress = loadInProgress(); // key -> {key, kind, query, status, request_id, startedAt}

  function loadInProgress() {
    try {
      const loaded = JSON.parse(sessionStorage.getItem('clara_in_progress') || '{}');
      const now = Date.now();
      for (const key of Object.keys(loaded)) {
        if (now - (loaded[key].startedAt || 0) > IN_PROGRESS_STALE_MS) delete loaded[key];
      }
      return loaded;
    } catch { return {}; }
  }

  function saveInProgress() {
    try {
      sessionStorage.setItem('clara_in_progress', JSON.stringify(inProgress));
    } catch { /* best effort */ }
  }

  const ASYNC_ACTIONS = { deferred_query: true, deliberate: true, brainstorm: true };

  const ASYNC_ACTION_LABELS = {
    deferred_query: 'Researching',
    deliberate: 'Deliberating',
    brainstorm: 'Sparking impulses',
  };

  function addInProgressPlaceholder(actionTaken, query) {
    const key = `q:${query}`;
    inProgress[key] = { key, kind: actionTaken, query, status: 'starting', startedAt: Date.now() };
    saveInProgress();
    renderInProgress();
  }

  function upsertInProgressFromServer(item) {
    // Drop any not-yet-upgraded placeholder for this same query — the
    // real request_id-keyed entry below replaces it.
    const placeholderKey = `q:${item.query}`;
    const startedAt = (inProgress[placeholderKey] && inProgress[placeholderKey].startedAt)
      || (inProgress[item.request_id] && inProgress[item.request_id].startedAt)
      || Date.now();
    if (inProgress[placeholderKey]) delete inProgress[placeholderKey];

    if (item.status === 'failed') {
      delete inProgress[item.request_id];
    } else {
      inProgress[item.request_id] = {
        key: item.request_id, kind: item.kind, query: item.query,
        status: item.status, request_id: item.request_id, startedAt,
      };
    }
    saveInProgress();
    renderInProgress();
  }

  function resolveInProgress(requestId, query) {
    if (requestId && inProgress[requestId]) delete inProgress[requestId];
    if (query && inProgress[`q:${query}`]) delete inProgress[`q:${query}`];
    saveInProgress();
    renderInProgress();
  }

  function renderInProgress() {
    const entries = Object.values(inProgress);
    inProgressStrip.hidden = entries.length === 0;
    inProgressStrip.innerHTML = '';
    entries.forEach(entry => {
      const chip = document.createElement('div');
      chip.className = `in-progress-chip kind-${entry.kind || 'research'}`;
      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = '⏳';
      const label = document.createElement('span');
      label.textContent = ASYNC_ACTION_LABELS[entry.kind] || 'Working';
      const q = document.createElement('span');
      q.className = 'q';
      q.textContent = entry.query;
      chip.appendChild(icon);
      chip.appendChild(label);
      chip.appendChild(q);
      inProgressStrip.appendChild(chip);
    });
  }

  // ── Message rendering: fenced code blocks + inline code ─────────────────────
  //
  // Deliberately not a full markdown renderer — just enough to make fenced
  // ```lang code blocks and `inline` spans readable, since that's the only
  // markdown shape LLM/assistant replies (and pasted-in visitor prompts)
  // realistically use here.

  const bubbleRawText = new WeakMap(); // bubble element -> original unescaped text

  // ```svg and ```dot/```graphviz fences get diagrammed inline instead of
  // shown as code. The renderer can only return a markup string synchronously,
  // but Viz.js's DOT->SVG render is async — so `renderer.code` below emits a
  // placeholder div and stashes the source here, keyed by a per-render id;
  // appendBubble() resolves each placeholder once the bubble is in the DOM.
  let diagramCounter = 0;
  const pendingDiagrams = new Map(); // id -> { kind: 'svg'|'dot', source: string }

  function renderDiagramBlock(kind, source) {
    const id = `diagram-${++diagramCounter}`;
    pendingDiagrams.set(id, { kind, source });
    return `<div class="diagram-block" data-diagram-id="${id}">` +
      `<div class="diagram-bar"><span class="diagram-kind">${escapeHtml(kind)}</span>` +
      `<div class="diagram-actions">` +
      `<button type="button" class="diagram-toggle-btn" title="Toggle source">&lt;/&gt;</button>` +
      `<button type="button" class="copy-code-btn" title="Copy source">⧉ copy</button>` +
      `</div></div>` +
      `<div class="diagram-render"><span class="diagram-status">Rendering…</span></div>` +
      `<pre class="diagram-source" hidden><code class="language-${escapeHtml(kind)}">${escapeHtml(source)}</code></pre>` +
      `</div>`;
  }

  function escapeHtml(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Assistant replies arrive as markdown (headings, bold/italic, lists,
  // links, code fences) but were previously only escaped as plain text —
  // only fenced/inline code got any special treatment. `marked` (vendored
  // locally, same convention as highlight.min.js) renders the rest; a
  // custom renderer keeps code blocks emitting the EXACT markup this file
  // already knows how to wire up below (hljs highlighting, the per-block
  // copy button) so that logic needs no changes.
  //
  // Security: markdown source here is LLM-generated text, not something
  // the visitor already trusts as HTML — a prompt-injected page ingested
  // via snek/edgequakeingest could in principle coax a reply into
  // containing literal HTML. `html()` below escapes any raw HTML embedded
  // in the markdown source (rendered as visible text, never executed);
  // `link()` restricts hrefs to http/https/mailto and adds
  // rel="noopener noreferrer" on the target="_blank" this app already
  // uses for other outbound links. ```svg fences and Viz.js's rendered
  // ```dot/```graphviz output are run through DOMPurify's SVG profile
  // (see sanitizeSvg) before ever touching innerHTML, since both are
  // otherwise live markup from the same untrusted source.
  let mdRenderer = null;
  function getMarkdownRenderer() {
    if (mdRenderer || !window.marked) return mdRenderer;
    const renderer = new window.marked.Renderer();
    renderer.code = (code, infostring) => {
      const lang = String(infostring || 'text').trim().split(/\s+/)[0].toLowerCase() || 'text';
      if (lang === 'svg' || lang === 'dot' || lang === 'graphviz') {
        return renderDiagramBlock(lang === 'graphviz' ? 'dot' : lang, code);
      }
      return `<pre class="code-block"><div class="code-block-bar"><span class="code-lang">${escapeHtml(lang)}</span><button type="button" class="copy-code-btn" title="Copy code">⧉ copy</button></div><code class="language-${escapeHtml(lang)}">${escapeHtml(code)}</code></pre>`;
    };
    renderer.codespan = (code) => `<code class="inline-code">${escapeHtml(code)}</code>`;
    renderer.link = (href, title, text) => {
      const safe = /^(https?:|mailto:)/i.test(String(href || ''));
      if (!safe) return text;
      const titleAttr = title ? ` title="${escapeHtml(title)}"` : '';
      return `<a href="${escapeHtml(href)}"${titleAttr} target="_blank" rel="noopener noreferrer">${text}</a>`;
    };
    renderer.html = (html) => escapeHtml(html);
    mdRenderer = renderer;
    return mdRenderer;
  }

  function renderMessageHtml(text) {
    const renderer = getMarkdownRenderer();
    if (!renderer) {
      // marked failed to load — degrade to the original plain-text-with-
      // code-fences rendering rather than showing nothing.
      const fenceRe = /```(\w+)?\n?([\s\S]*?)```/g;
      let html = '';
      let lastIndex = 0;
      let match;
      const inlineCode = (escaped) => escaped.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');
      while ((match = fenceRe.exec(text)) !== null) {
        html += inlineCode(escapeHtml(text.slice(lastIndex, match.index)));
        const lang = (match[1] || 'text').toLowerCase();
        const code = match[2].replace(/\n$/, '');
        html += `<pre class="code-block"><div class="code-block-bar"><span class="code-lang">${escapeHtml(lang)}</span><button type="button" class="copy-code-btn" title="Copy code">⧉ copy</button></div><code class="language-${escapeHtml(lang)}">${escapeHtml(code)}</code></pre>`;
        lastIndex = fenceRe.lastIndex;
      }
      html += inlineCode(escapeHtml(text.slice(lastIndex)));
      return html;
    }
    return window.marked.parse(text, { renderer, breaks: true, gfm: true });
  }

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (err) {
      console.warn('Fallback copy failed:', err);
    }
    document.body.removeChild(ta);
    return ok;
  }

  async function copyToClipboard(text, btn) {
    let ok = false;
    // navigator.clipboard only exists in secure contexts (HTTPS or
    // localhost) — plain-HTTP access over a hostname/IP falls through
    // to the execCommand fallback below.
    if (window.isSecureContext && navigator.clipboard) {
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (err) {
        console.warn('navigator.clipboard.writeText failed:', err);
      }
    }
    if (!ok) ok = legacyCopy(text);

    if (!btn) return;
    const prev = btn.textContent;
    const isCodeBtn = btn.classList.contains('copy-code-btn');
    if (ok) {
      btn.textContent = isCodeBtn ? '✓ copied' : '✓';
      btn.classList.add('copied');
    } else {
      btn.textContent = isCodeBtn ? '✗ failed' : '✗';
      btn.classList.add('copy-failed');
    }
    setTimeout(() => {
      btn.textContent = prev;
      btn.classList.remove('copied', 'copy-failed');
    }, 1200);
  }

  // Both ```svg source and Viz.js's rendered ```dot output are live markup
  // from the same untrusted (LLM/visitor) source as the rest of the bubble —
  // sanitize before it ever reaches innerHTML. foreignObject is stripped on
  // top of DOMPurify's own script/event-handler/javascript:-URI stripping
  // since it can carry arbitrary HTML/CSS (e.g. a spoofed form) without
  // needing script execution to be dangerous.
  function sanitizeSvg(svgText) {
    if (!window.DOMPurify) {
      console.warn('DOMPurify unavailable — refusing to render untrusted SVG/DOT markup');
      return null;
    }
    const clean = window.DOMPurify.sanitize(svgText, {
      USE_PROFILES: { svg: true, svgFilters: true },
      FORBID_TAGS: ['script', 'foreignObject'],
    });
    return clean && clean.trim() ? clean : null;
  }

  let vizInstance = null;
  async function renderDotToSvg(source) {
    if (!window.Viz) throw new Error('Graphviz renderer unavailable');
    // A Viz instance is single-use per the library's own docs (its
    // underlying emscripten module can't be reliably reused after a
    // parse error) — replace it whenever one fails.
    if (!vizInstance) vizInstance = new window.Viz();
    try {
      return await vizInstance.renderString(source, { format: 'svg', engine: 'dot' });
    } catch (err) {
      vizInstance = new window.Viz();
      throw err;
    }
  }

  async function resolveDiagram(container, kind, source) {
    const target = container.querySelector('.diagram-render');
    try {
      const svgText = kind === 'dot' ? await renderDotToSvg(source) : source;
      const clean = sanitizeSvg(svgText);
      if (!clean) throw new Error('sanitized SVG was empty');
      target.innerHTML = clean;
      const svgEl = target.querySelector('svg');
      if (svgEl) {
        svgEl.removeAttribute('width');
        svgEl.removeAttribute('height');
      }
    } catch (err) {
      console.warn(`Failed to render ${kind} diagram:`, err);
      target.innerHTML = `<span class="diagram-error">Couldn't render this ${escapeHtml(kind)} block — showing source instead.</span>`;
      const src = container.querySelector('.diagram-source');
      if (src) src.hidden = false;
    }
  }

  // ── DOM helpers ────────────────────────────────────────────────────────────

  function appendBubble(role, text, speaker, extraClass) {
    if (role === 'system-note') {
      const div = document.createElement('div');
      div.className = 'system-note';
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${role}`;

    const lbl = document.createElement('div');
    lbl.className = 'msg-label';
    lbl.textContent = role === 'user' ? 'Visitor' : (speaker || agentName);

    const bub = document.createElement('div');
    bub.className = extraClass ? `bubble ${role} ${extraClass}` : `bubble ${role}`;
    bub.innerHTML = renderMessageHtml(text);
    bubbleRawText.set(bub, text);

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'copy-btn';
    copyBtn.title = 'Copy message';
    copyBtn.textContent = '⧉';
    copyBtn.addEventListener('click', () => copyToClipboard(bubbleRawText.get(bub) ?? text, copyBtn));
    bub.appendChild(copyBtn);

    bub.querySelectorAll('pre.code-block code').forEach((el) => {
      if (window.hljs) window.hljs.highlightElement(el);
    });
    bub.querySelectorAll('.copy-code-btn').forEach((btn) => {
      const codeEl = btn.closest('pre.code-block, .diagram-block').querySelector('code');
      btn.addEventListener('click', () => copyToClipboard(codeEl.textContent, btn));
    });
    bub.querySelectorAll('.diagram-block').forEach((el) => {
      const id = el.dataset.diagramId;
      const pending = pendingDiagrams.get(id);
      if (pending) {
        pendingDiagrams.delete(id);
        resolveDiagram(el, pending.kind, pending.source);
      }
      const toggleBtn = el.querySelector('.diagram-toggle-btn');
      const src = el.querySelector('.diagram-source');
      toggleBtn.addEventListener('click', () => {
        src.hidden = !src.hidden;
        toggleBtn.classList.toggle('active', !src.hidden);
      });
    });

    wrap.appendChild(lbl);
    wrap.appendChild(bub);
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
    return bub;
  }

  function appendNote(text) {
    appendBubble('system-note', text);
  }

  function showThinking() {
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking';
    thinkingEl.textContent = `${agentName} is consulting the records…`;
    messages.appendChild(thinkingEl);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeThinking() {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  function setStatus(s) {
    const labels = { active: 'Active', admitted: 'Admitted', denied: 'Denied', redirected: 'Redirected' };
    badge.textContent = labels[s] || s;
    badge.className   = s || '';
  }

  function disableInput() {
    input.disabled   = true;
    sendBtn.disabled = true;
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      send();
    }
    // plain Enter / Shift+Enter: fall through to the textarea's default
    // newline behavior — never submits.
  });
  input.addEventListener('input', autoGrowInput);

  // ── Login (username only, no password — demo) ──────────────────────────────

  const loginScreen   = document.getElementById('login-screen');
  const loginForm     = document.getElementById('login-form');
  const loginUsername = document.getElementById('login-username');
  const loginSubmit    = document.getElementById('login-submit');
  const loginError     = document.getElementById('login-error');

  async function doLogin(username) {
    loginSubmit.disabled = true;
    loginError.textContent = '';
    try {
      const resp = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username }),
      });
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        throw new Error(body.error || `login failed (${resp.status})`);
      }
      const { token } = await resp.json();
      // Fresh login, fresh session — also drop any research state left
      // over from whatever session used this tab before.
      sessionStorage.removeItem('clara_session_id');
      sessionStorage.removeItem('clara_pending_research');
      sessionStorage.removeItem('clara_in_progress');
      pendingResearch = [];
      inProgress = {};
      sessionStorage.setItem('clara_token', token);
      sessionStorage.setItem('clara_username', username);
      loginScreen.classList.add('hidden');
      connect(token);
    } catch (e) {
      loginError.textContent = e.message || 'Login failed — try again.';
      loginSubmit.disabled = false;
    }
  }

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const username = loginUsername.value.trim();
    if (username) doLogin(username);
  });

  // Restore any persisted pending-research/in-progress state immediately —
  // before the WS even connects — so a reload shows the visitor what was
  // already there rather than a blank strip/bell until the next 5s tick
  // reconciles with the server.
  renderResearchQueue();
  renderInProgress();

  // A per-tab token already in sessionStorage (e.g. a same-tab reload)
  // skips straight to the chat UI — a brand-new tab has no sessionStorage
  // entry and re-prompts, matching per-session login semantics.
  const existingToken = sessionStorage.getItem('clara_token');
  if (existingToken) {
    loginScreen.classList.add('hidden');
    connect(existingToken);
  } else {
    loginUsername.focus();
  }
</script>
</body>
</html>
