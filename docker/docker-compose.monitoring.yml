# Prometheus + Grafana + node_exporter for the Clara stack — runs on pineal
# per the 2026-10-01 monitoring rollout plan (limbic is GPU-taxed; pineal is
# comparatively idle and already hosts one host-networked FieryPit).
#
# Everything here is network_mode: host, matching the existing precedent set
# by docker-compose.remote-fierypit.yml on this same host: Docker's own
# DOCKER-USER iptables chain can silently drop bridge-to-host traffic ahead
# of ufw's rules (confirmed live on this host, see that file's comment).
# Host networking sidesteps it entirely — Prometheus reaching this host's
# own FieryPits is just `localhost:<port>`, no bridge involved.
#
# Usage:
#   cd ~/widebody/Development/clara-cerebellum/docker
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Scrape targets on limbic (clara-api:8080, lildaemon:6666, lildaemon-ego:6667,
# node-exporter:9100) need a `ufw allow from <pineal-IP> to any port <port>
# proto tcp` on limbic — not run here, needs sudo on that host.
#
# Grafana (port 3000) is LAN-only by firewall, matching this stack's existing
# no-app-auth-but-firewalled posture elsewhere (Kafka, clara-api) — change
# the default admin password on first login; add a ufw rule to open 3000 to
# whatever source should reach it.

name: monitoring

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    network_mode: host
    pid: host
    volumes:
      # Plain :ro, not :ro,rslave — this host's `/` isn't a shared/slave
      # mount (confirmed live: rslave fails with "path / is mounted on /
      # but it is not a shared or slave mount"). Loses visibility into
      # mounts added after the container starts; fine for the CPU/mem/
      # disk/network metrics this is here for.
      - /:/host:ro
    command:
      - "--path.rootfs=/host"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    network_mode: host
    environment:
      - GF_SERVER_HTTP_PORT=3000
      # Datasource auto-provisioned below talks to Prometheus over localhost
      # since both are host-networked on this same box.
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
