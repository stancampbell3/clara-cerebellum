# The Ego FieryPit on a REMOTE host (pineal): the same `lildaemon-ego` as docker-compose.ego.yml, but with no
# dependency on the main stack's docker network. Dis and Kafka are reached over the LAN by hostname (extra_hosts
# maps `limbic`, which containers here cannot resolve), and this FieryPit is identified to Dis by the URL others
# use to reach it (`http://<this host>:6667`), never by a docker network name.
#
# Run it on the remote host, from a directory holding a 0600 `.env` with LILDAEMON_JWT_SECRET,
# LILDAEMON_SERVICE_SECRET and DIS_DOMAIN_PEER_TOKEN (the same peer token as the rest of the Dis domain), with the
# image already loaded (`docker save lildaemon:ego | ssh <host> docker load`; it is built WITHOUT .env):
#
#   EGO_STATE_DIR=$HOME/ego/state SEAT_LAUNCHER_DIR=$HOME/ego/sl EGO_GATE_MODE=superego \
#     docker compose -f docker-compose.ego-remote.yml up -d
#
# Host prerequisites (the runbook has the commands): a `clara-seats` bridge with the FIXED interface name
# br-clara-seats, one firewall rule letting that interface reach the host's Ollama (11434), the Hermes image, the
# `qwen-clara-hermes` 64K-context model, and the seat launcher running with its socket in $SEAT_LAUNCHER_DIR.
# Snap docker can only bind-mount under $HOME.
#
# Ritual space and the outbox live on /mnt/clara-shared (see scripts/setup_clara_shared_nfs_{server,client}.sh
# and docs/clara_shared_nfs_plan.md), not local disk: confirmed live 2026-09-22 across limbic+pineal that this is
# safe for the actual deployment pattern (one ritual is always written by exactly one Ego FieryPit at a time), but
# NOT safe if two DIFFERENT hosts ever write the SAME ritual_id concurrently -- that races even with the lock held
# correctly, and silently loses data (see the plan doc's "flock over NFS" section). $HOME-local `data/`, `output/`
# and `workspace/` are unaffected -- those are per-seat/per-process scratch, never shared collaboration data.
name: ego

services:
  lildaemon-ego:
    image: lildaemon:ego
    ports:
      # Reachable from the rest of the LAN (limbic's assistant calls it here). Protected by the peer token.
      - "0.0.0.0:6667:6666"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Docker cannot read the host /etc/hosts, so this needs an IP: set LIMBIC_IP in .env.
      - "limbic:${LIMBIC_IP:-192.168.1.68}"
    environment:
      - CEREBELLUM_URL=http://limbic:8080
      - DIS_BASE_URL=http://limbic:8080
      - LILDAEMON_JWT_SECRET=${LILDAEMON_JWT_SECRET}
      - LILDAEMON_SERVICE_SECRET=${LILDAEMON_SERVICE_SECRET}
      - DIS_DOMAIN_PEER_TOKEN=${DIS_DOMAIN_PEER_TOKEN}
      - DIS_DOMAIN=${DIS_DOMAIN:-dis.local}
      # How Dis (and the main FieryPit) reach THIS FieryPit.
      - LILDAEMON_BASE_URL=${EGO_PUBLIC_URL:-http://pineal:6667}
      - FIERYPIT_HEARTBEAT_INTERVAL_SECONDS=${FIERYPIT_HEARTBEAT_INTERVAL_SECONDS:-30}
      - LILDAEMON_DB_PATH=/app/data/lildaemon.duc
      - LILDAEMON_OUTPUT_DIR=/app/output
      - PYTHON_TOOLS_WORKSPACE=/app/workspace
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # No third-party credentials. Edgequake is reachable READ-ONLY for the Edgequake MCP tools (clara_mind_splinter_edgequake): this
      # FieryPit uses limbic's Edgequake but does not own its documents, so the assistant-documents reaper and the composed-analyst
      # warm-up stay off. Edgequake needs no API key here (kept empty); the tenant is only used to resolve the workspace slug.
      - EDGEQUAKE_BASE_URL=${EDGEQUAKE_BASE_URL:-http://limbic:8082}
      - EDGEQUAKE_DEFAULT_TENANT=${EDGEQUAKE_DEFAULT_TENANT:-00000000-0000-0000-0000-000000000002}
      - ASSISTANT_REAP_ENABLED=0
      # Scrape-time label (fierypit_info); Prometheus's own `fierypit` label comes from prometheus.yml.
      - FIERYPIT_INSTANCE=pineal-ego
      # Optional OTLP/HTTP log export, e.g. http://pineal:3100/otlp (Loki's native endpoint). Blank = off.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # This FieryPit hosts Ego seats, not the assistant: no composed-analyst warm-up (it would build a duplicate family in Dis).
      - ASSISTANT_COMPOSED_WARM=0
      - EDGEQUAKE_API_KEY=
      - GROQ_API_KEY=
      - GITHUB_TOKEN=
      - GOOGLE_CUSTOM_SEARCH_API_KEY=
      # Ego seats and the real gate (see docker-compose.ego.yml for what each does).
      - EGO_GATE_ENABLED=1
      - EGO_GATE_HOST=0.0.0.0
      - EGO_GATE_PORT=8765
      - EGO_GATE_ADVERTISE_URL=http://lildaemon-ego:8765/mcp
      - SEAT_LAUNCHER_SOCKET=/run/seat-launcher/l.sock
      - RITUAL_SPACE_ROOT=/app/ritual_spaces
      - EGO_GATE_MODE=${EGO_GATE_MODE:-deny_all}
      - EGO_GATE_SUPEREGO_NODE=${EGO_GATE_SUPEREGO_NODE:-superego}
      - EGO_GATE_SUPEREGO_MODEL=${EGO_GATE_SUPEREGO_MODEL:-qwen-clara-hermes:latest}
      # Let the reviewer reason before answering. Off suits a large model (1-5 s); a 9B needs it on to judge well.
      - EGO_GATE_SUPEREGO_THINK=${EGO_GATE_SUPEREGO_THINK:-}
      - EGO_OUTBOX_ROOT=/app/outbox
      - EGO_SEAT_IDLE_SECONDS=${EGO_SEAT_IDLE_SECONDS:-900}
    volumes:
      - ${EGO_STATE_DIR:?set EGO_STATE_DIR to a directory under $HOME}/data:/app/data
      - ${EGO_STATE_DIR}/output:/app/output
      - ${EGO_STATE_DIR}/workspace:/app/workspace
      - ${CLARA_SHARED_ROOT:-/mnt/clara-shared}/ritual-spaces:/app/ritual_spaces
      - ${CLARA_SHARED_ROOT:-/mnt/clara-shared}/outbox:/app/outbox
      - ${SEAT_LAUNCHER_DIR:?set SEAT_LAUNCHER_DIR to the launcher's socket directory}:/run/seat-launcher
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6666/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      clara-seats:
        aliases:
          - lildaemon-ego

networks:
  clara-seats:
    external: true
    name: clara-seats
