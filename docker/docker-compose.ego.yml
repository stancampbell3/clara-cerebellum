# A SECOND, separate FieryPit ("lildaemon-ego") that hosts Hermes Ego seats. Its own compose project
# (`ego`), its own image tag (lildaemon:ego), its own state. It registers with the existing Dis by URL
# like any FieryPit, and it touches nothing in the main stack: the live `lildaemon` container,
# `lildaemon:latest` and docker-compose.yml are not modified. Roll back with `docker compose -f
# docker-compose.ego.yml down`.
#
# Full walkthrough: clara-cerebellum/docs/hermes_ego_limbic_runbook.md
#
# Prerequisites (the runbook has the commands):
#   - the main stack is up (Dis = clara-api, Kafka) and its `.env` supplies the secrets referenced below
#   - the seat launcher is running on this host, with its socket in $SEAT_LAUNCHER_DIR (created by you first,
#     so it is owned by you and not by root)
#   - the host directories under $EGO_STATE_DIR exist
#
#   docker compose -f docker-compose.ego.yml up -d --build
#
# Network design: seats run on the dedicated `clara-seats` bridge, NOT on clara-net, so a seat cannot reach
# the main stack's services BY NAME on the docker networks (verified live: Dis, Kafka, Cobbler, Edgequake do
# not resolve). Only this FieryPit is attached to both networks. This is NOT egress filtering: through the
# docker host gateway a seat can still reach anything the host publishes (Dis :8080, Kafka :9094, Cobbler, ssh)
# and resolve LAN names. Hermes has no native network tools (only the MCP gate), so the model cannot open
# those connections, but add host firewall rules on the clara-seats bridge if you want defense in depth. Nothing in the code
# assumes any network name: FieryPits can be remote and are identified by URL. The gate URL below is simply
# how seats reach THIS FieryPit on the network the launcher puts them on.
name: ego

services:
  lildaemon-ego:
    build:
      context: ../..
      dockerfile: clara-cerebellum/docker/Dockerfile.lildaemon
    image: lildaemon:ego
    ports:
      # Loopback only: for the driver script on this host. Not published to the LAN.
      - "127.0.0.1:6667:6666"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CEREBELLUM_URL=http://clara-api:8080
      - DIS_BASE_URL=http://clara-api:8080
      - LILDAEMON_JWT_SECRET=${LILDAEMON_JWT_SECRET}
      - LILDAEMON_SERVICE_SECRET=${LILDAEMON_SERVICE_SECRET}
      - DIS_DOMAIN_PEER_TOKEN=${DIS_DOMAIN_PEER_TOKEN}
      - DIS_DOMAIN=${DIS_DOMAIN:-dis.local}
      # This FieryPit's own identity, by URL (how Dis and peers reach it), independent of any network name.
      - LILDAEMON_BASE_URL=http://lildaemon-ego:6666
      - FIERYPIT_HEARTBEAT_INTERVAL_SECONDS=${FIERYPIT_HEARTBEAT_INTERVAL_SECONDS:-30}
      - LILDAEMON_DB_PATH=/app/data/lildaemon.duc
      - LILDAEMON_OUTPUT_DIR=/app/output
      - PYTHON_TOOLS_WORKSPACE=/app/workspace
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # This FieryPit must not act on shared resources or hold the main stack's third-party credentials.
      # Images built BEFORE 2026-09-21 baked a copy of the repo's `.env` that goat/__init__.py loads at import, so
      # simply not setting these was not enough (found live: EDGEQUAKE_BASE_URL=http://localhost:8082 came from
      # it, and the assistant-documents reaper ran). Dockerfile.lildaemon.dockerignore now excludes `.env`, but
      # these explicit EMPTY values stay as belt and braces: an empty variable wins over any baked file
      # (load_dotenv never overrides an existing variable) and keeps the reaper and third-party evaluators off.
      - EDGEQUAKE_BASE_URL=
      - EDGEQUAKE_API_KEY=
      - GROQ_API_KEY=
      - GITHUB_TOKEN=
      - GOOGLE_CUSTOM_SEARCH_API_KEY=
      #
      # Ego seats (see goat/mcp/ego_gate, goat/evaluators/custom/hermes_agent_evaluator.py):
      - EGO_GATE_ENABLED=1
      - EGO_GATE_HOST=0.0.0.0            # listens inside this container only; not published
      - EGO_GATE_PORT=8765
      - EGO_GATE_ADVERTISE_URL=http://lildaemon-ego:8765/mcp
      - SEAT_LAUNCHER_SOCKET=/run/seat-launcher/l.sock
      - RITUAL_SPACE_ROOT=/app/ritual_spaces
      # Phase 2, the real gate. deny_all (default here): every request_action is refused, nothing runs.
      # superego: a Prolog policy decides through Dis (DIS_BASE_URL above); allowlisted actions
      # (export_document, record_note) may then execute into EGO_OUTBOX_ROOT, and free-form actions go to
      # the reviewing LLM node of the same ritual and can NEVER execute. Every decision and execution is
      # appended to <RITUAL_SPACE_ROOT>/<ritual_id>/actions.jsonl, which the model has no tool to reach.
      - EGO_GATE_MODE=${EGO_GATE_MODE:-deny_all}
      - EGO_GATE_SUPEREGO_NODE=${EGO_GATE_SUPEREGO_NODE:-superego}
      - EGO_GATE_SUPEREGO_MODEL=${EGO_GATE_SUPEREGO_MODEL:-qwen-clara-hermes:latest}
      # Let the reviewer reason before answering. Off suits a large model (1-5 s); a 9B needs it on to judge well.
      - EGO_GATE_SUPEREGO_THINK=${EGO_GATE_SUPEREGO_THINK:-}
      - EGO_OUTBOX_ROOT=/app/outbox
      # Phase 3: how an ASSISTANT runtime (the `ego` ruleset; here this same FieryPit, or the main one) reaches
      # the FieryPit that hosts the Ego seats, by URL, and the Kafka listener that FieryPit's participants
      # use. Escalations (Approve/Deny) and seat release go to EGO_FIERYPIT_URL with the peer token.
      # EGO_ESCALATION_TTL_SECONDS (default 86400): how long an escalation stays open before it counts as denied.
      # A Hermes seat idle this long (seconds) is released and the next request starts a fresh one, so seats do not
      # pile up against the launcher's max_seats when a browser tab is closed without ending its session.
      - EGO_SEAT_IDLE_SECONDS=${EGO_SEAT_IDLE_SECONDS:-900}
      - EGO_FIERYPIT_URL=${EGO_FIERYPIT_URL:-http://lildaemon-ego:6666}
      - EGO_REMOTE_KAFKA_BOOTSTRAP=${EGO_REMOTE_KAFKA_BOOTSTRAP:-kafka:9092}
    volumes:
      - ${EGO_STATE_DIR:-/tmp/ego-fierypit}/data:/app/data
      - ${EGO_STATE_DIR:-/tmp/ego-fierypit}/output:/app/output
      - ${EGO_STATE_DIR:-/tmp/ego-fierypit}/workspace:/app/workspace
      # Documents shared by a ritual's participants (goat/ritual_space). Outside any repository tree.
      - ${EGO_STATE_DIR:-/tmp/ego-fierypit}/ritual_spaces:/app/ritual_spaces
      # Where approved export_document / record_note actions write, for pickup outside the ritual. The only
      # place an approved action can leave a file; nothing else on the host is writable from here.
      - ${EGO_STATE_DIR:-/tmp/ego-fierypit}/outbox:/app/outbox
      # The seat launcher's unix socket (its DIRECTORY is mounted). This is the ONLY route to container
      # control; docker.sock is never mounted.
      - ${SEAT_LAUNCHER_DIR:-/tmp/sl-ego}:/run/seat-launcher
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6666/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      clara-net: {}
      clara-seats:
        aliases:
          - lildaemon-ego

networks:
  clara-net:
    external: true
    name: docker_clara-net
  clara-seats:
    driver: bridge
    name: clara-seats
