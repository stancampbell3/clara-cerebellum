# Clara PoC Stack — Docker Compose
#
# Build context: Development/ (two levels up from this file)
# Run from Development/:
#   docker compose -f clara-cerebellum/docker/docker-compose.yml --env-file clara-cerebellum/docker/.env up -d
#
# Or from this directory:
#   docker compose --env-file .env up -d
#
# This is the LOCAL stack (Kafka + clara-api/Dis + this host's own
# lildaemon/FieryPit). A FieryPit-capable host that only wants to lend
# its own compute (Ollama/GPU) to Rituals against a Dis instance running
# elsewhere runs docker-compose.remote-fierypit.yml instead — see
# docs/remote_fierypit_deployment.md.

services:
  kafka:
    image: apache/kafka:latest
    ports:
      # 9094 is the external listener — used by cargo run / ./Dis on the
      # host, AND (as of the FieryPit registration/discovery feature,
      # docs/fierypit_registration_plan.md) by remote FieryPits on the LAN.
      # Bound to the LAN interface (0.0.0.0), not just 127.0.0.1 — access
      # control is host firewall only (e.g. `ufw`), matching the
      # "firewall only, no proxy" posture already used elsewhere in this
      # stack; Kafka itself still has zero authentication (unchanged by
      # this feature). Override KAFKA_EXTERNAL_BIND_HOST in .env to
      # narrow this back to 127.0.0.1 if LAN exposure isn't wanted.
      - "${KAFKA_EXTERNAL_BIND_HOST:-0.0.0.0}:9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      # INTERNAL: for containers on clara-net; EXTERNAL: for host processes
      # and, now, LAN-remote FieryPits; CONTROLLER: KRaft
      - KAFKA_LISTENERS=INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      # EXTERNAL's advertised host must be reachable from wherever a client
      # connects with this address in hand — "localhost" only works for
      # processes on this same host. Set KAFKA_EXTERNAL_ADVERTISED_HOST to
      # this host's LAN IP/hostname (e.g. "limbic" or "10.0.0.192") for a
      # remote FieryPit's KAFKA_BOOTSTRAP to actually resolve.
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_ADVERTISED_HOST:-localhost}:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - clara-net

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    ports:
      - "0.0.0.0:8083:8080"
    environment:
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clara-net

  clara-api:
    build:
      context: ../..
      dockerfile: clara-cerebellum/docker/Dockerfile
      target: clara-api
    image: clara-api:latest
    ports:
      - "0.0.0.0:8080:8080"
      - "0.0.0.0:9090:9090"
    environment:
      - RUST_LOG=info
      - JWT_SECRET=${JWT_SECRET}
      - FIERYPIT_URL=http://lildaemon:6666
      - KAFKA_BOOTSTRAP=kafka:9092
      # Shared secret used to acquire a lildaemon service JWT at Ritual bootstrap.
      # Must match LILDAEMON_SERVICE_SECRET in the lildaemon service below.
      - LILDAEMON_SERVICE_SECRET=${LILDAEMON_SERVICE_SECRET}
      # Shared secret gating PUT/GET/DELETE /fierypits (FieryPit
      # registration/discovery) and cross-FieryPit POST /ritual/join.
      # Must match DIS_DOMAIN_PEER_TOKEN in the lildaemon service below,
      # and on every remote FieryPit registering under this Dis domain.
      - DIS_DOMAIN_PEER_TOKEN=${DIS_DOMAIN_PEER_TOKEN}
      - FIERYPIT_REGISTRATION_TTL_SECONDS=${FIERYPIT_REGISTRATION_TTL_SECONDS:-90}
      # Edgequake RAG API, used by the `edgequake` tool (clara-toolbox) that
      # backs the_cow.pl/the_cow.clp for Prolog/CLIPS.
      - EDGEQUAKE_BASE_URL=${EDGEQUAKE_BASE_URL:-http://10.0.0.192:8082}
      - EDGEQUAKE_API_KEY=${EDGEQUAKE_API_KEY}
      # Optional tenant/workspace scoping (X-Tenant-ID/X-Workspace-ID headers).
      # Unset = no scoping, Edgequake falls back to its own default tenant/workspace.
      - EDGEQUAKE_DEFAULT_TENANT=${EDGEQUAKE_DEFAULT_TENANT:-}
      - EDGEQUAKE_DEFAULT_WORKSPACE=${EDGEQUAKE_DEFAULT_WORKSPACE:-}
      # Dagda model (fasttext) supporting the "classify" tool
      - DAGDA_MODEL_PATH=${DAGDA_MODEL_PATH:-/etc/clara/models/dagda-0.2.bin}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      # FastText model files (860 MB) mounted read-only — not baked into image
      - ../models:/etc/clara/models:ro
      # Coire DuckDB — persists across container rebuilds
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - clara-net

  prolog-mcp:
    build:
      context: ../..
      dockerfile: clara-cerebellum/docker/Dockerfile
      target: prolog-mcp
    image: clara-prolog-mcp:latest
    ports:
      - "0.0.0.0:1968:1968"
    environment:
      - REST_API_URL=http://clara-api:8080
    depends_on:
      clara-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/1968"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - clara-net

  clips-mcp:
    build:
      context: ../..
      dockerfile: clara-cerebellum/docker/Dockerfile
      target: clips-mcp
    image: clara-clips-mcp:latest
    ports:
      - "0.0.0.0:1951:1951"
    environment:
      - REST_API_URL=http://clara-api:8080
    depends_on:
      clara-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/1951"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - clara-net

  lildaemon:
    build:
      context: ../..
      dockerfile: clara-cerebellum/docker/Dockerfile.lildaemon
    image: lildaemon:latest
    ports:
      - "127.0.0.1:6666:6666"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CEREBELLUM_URL=http://clara-api:8080
      # Dis (clara-api) ritual endpoints — used by DisClient when activating rituals.
      - DIS_BASE_URL=http://clara-api:8080
      - LILDAEMON_JWT_SECRET=${LILDAEMON_JWT_SECRET}
      - LILDAEMON_BASE_URL=http://lildaemon:6666
      - LILDAEMON_DB_PATH=/app/data/lildaemon.duc
      - LILDAEMON_OUTPUT_DIR=/app/output
      # Base directory python_tools.py's file-tool functions (read_file,
      # write_file, list_files, run_awk, run_sed, download_file) are
      # confined to. Left unset, it defaults to the process cwd (/app),
      # which has NO volume mount of its own -- every such write would be
      # ephemeral, gone on the next `up`/`--force-recreate`. Pointing it at
      # the already-mounted workspace volume below makes tool-driven file
      # work actually persist to disk as intended. Each ToolifiedOllama-
      # Evaluator instance additionally gets its own private subdirectory
      # under this root (see workspace_dir in goat/evaluators/
      # toolified_ollama.py) so concurrent instances -- e.g. multiple
      # Ritual seats spawned from one evaluators.yaml registration, which
      # share an evaluator_id -- never share files.
      - PYTHON_TOOLS_WORKSPACE=/app/workspace
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Shared secret gating POST /auth/service-token.
      # Must match LILDAEMON_SERVICE_SECRET in the clara-api service above.
      - LILDAEMON_SERVICE_SECRET=${LILDAEMON_SERVICE_SECRET}
      # Shared secret used both for cross-FieryPit POST /ritual/join
      # (goat/app/fiery_pit_peer_client.py) and for this FieryPit's own
      # registration/heartbeat with Dis (goat/app/dis_client.py's
      # register_fiery_pit/deregister_fiery_pit). Must match
      # DIS_DOMAIN_PEER_TOKEN in the clara-api service above, and on every
      # other FieryPit under this Dis domain (see
      # docs/fierypit_registration_plan.md).
      - DIS_DOMAIN_PEER_TOKEN=${DIS_DOMAIN_PEER_TOKEN}
      # The Dis domain this FieryPit registers under — must match clara-
      # api's config/default.toml `server.dis_domain_id` by convention
      # (not validated anywhere; same manual-consistency burden
      # LILDAEMON_SERVICE_SECRET already carries).
      - DIS_DOMAIN=${DIS_DOMAIN:-dis.local}
      - FIERYPIT_HEARTBEAT_INTERVAL_SECONDS=${FIERYPIT_HEARTBEAT_INTERVAL_SECONDS:-30}
      - GOOGLE_CUSTOM_SEARCH_API_KEY=${GOOGLE_CUSTOM_SEARCH_API_KEY}
      - GOOGLE_CUSTOM_SEARCH_CX=${GOOGLE_CUSTOM_SEARCH_CX}
      # Ochecho TTS (goat.mcp.ochecho, used by the clara_mind_splinter evaluator's
      # "ochecho" MCP server). Ochecho itself runs natively on the host — not in
      # Docker — because it needs the host's CUDA/GPU venv (see ochecho/README.md).
      # Reached the same way OLLAMA_BASE_URL is above, via host.docker.internal.
      - OCHECHO_SERVER=http://host.docker.internal:1932
      - OCHECHO_TOKEN=${OCHECHO_TOKEN}
      # Edgequake RAG API, used by goat/mcp/edgequake (LLM tool-calling side).
      - EDGEQUAKE_BASE_URL=${EDGEQUAKE_BASE_URL:-http://10.0.0.192:8082}
      - EDGEQUAKE_API_KEY=${EDGEQUAKE_API_KEY}
      # Optional tenant/workspace scoping (X-Tenant-ID/X-Workspace-ID headers).
      # Unset = no scoping, Edgequake falls back to its own default tenant/workspace.
      - EDGEQUAKE_DEFAULT_TENANT=${EDGEQUAKE_DEFAULT_TENANT:-}
      - EDGEQUAKE_DEFAULT_WORKSPACE=${EDGEQUAKE_DEFAULT_WORKSPACE:-}
      # Background reap scheduler (goat/models/ReapScheduler.py) for the
      # assistant's shared Edgequake workspace — see lildaemon/docs/
      # assistant_demo.md's "Reap scheduler" section. INTERVAL is how often
      # the sweep runs; IDLE is how long a document must go uncited (or
      # uncited-since-ingest, if never cited) before it's eligible for
      # deletion.
      - ASSISTANT_REAP_INTERVAL_SECONDS=${ASSISTANT_REAP_INTERVAL_SECONDS:-3600}
      - ASSISTANT_REAP_IDLE_SECONDS=${ASSISTANT_REAP_IDLE_SECONDS:-86400}
      # Background reap scheduler for expired REPL sessions
      # (ServerReplSessionStore.reap_expired). INTERVAL is how often the
      # sweep runs; IDLE is how long a session can go untouched before
      # it's reaped.
      - REPL_SESSION_REAP_INTERVAL_SECONDS=${REPL_SESSION_REAP_INTERVAL_SECONDS:-3600}
      - REPL_SESSION_REAP_IDLE_SECONDS=${REPL_SESSION_REAP_IDLE_SECONDS:-3600}
      # progressive_research.pl's deferred_query action fires a background
      # research crawl (assistant_pending_research); this is how often the
      # poller checks for convergence and advances researching -> answering
      # -> ready. Short by design — polling is cheap, and a shorter interval
      # means a "best answer so far" reply gets its fuller follow-up sooner.
      - PENDING_RESEARCH_POLL_INTERVAL_SECONDS=${PENDING_RESEARCH_POLL_INTERVAL_SECONDS:-10}
    volumes:
      - ../lildaemon/data:/app/data
      - ../lildaemon/output:/app/output
      - ../lildaemon/workspace:/app/workspace
      - /mnt/moonpool:/app/moonpool:ro
    depends_on:
      clara-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6666/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - clara-net

  cobbler:
    build:
      context: ../..
      dockerfile: clara-cerebellum/docker/Dockerfile.cobbler
    image: cobbler:latest
    ports:
      - "0.0.0.0:5001:5001"
    environment:
      - LILDAEMON_URL=http://lildaemon:6666
      - DIS_URL=http://clara-api:8080
      - LILD_SESSIONS_DIR=/lild-output/sessions
      - LILD_SESSION_GLOB=/lild-output/context/mu_*.json
      - COBBLER_BASE_PATH=/cobbler
    volumes:
      - ../lildaemon/output:/lild-output
    depends_on:
      lildaemon:
        condition: service_healthy
      clara-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clara-net

  clara-frontdesk:
    build:
      context: ../..
      dockerfile: clara-cerebellum/docker/Dockerfile
      target: frontdesk
    image: clara-frontdesk:latest
    ports:
      - "0.0.0.0:8088:8088"
    depends_on:
      clara-api:
        condition: service_healthy
      lildaemon:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clara-net

networks:
  clara-net:
    driver: bridge
