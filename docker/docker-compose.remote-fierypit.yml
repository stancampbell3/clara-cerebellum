# Standalone remote FieryPit — Docker Compose
#
# Runs ONLY the lildaemon (FieryPit) service, on its own, on any host that
# has (or wants to lend) local compute — Ollama on a GPU, typically. It
# registers itself with an already-running Dis instance elsewhere on the
# LAN (see docs/fierypit_registration_plan.md) on its own, at startup, via
# the same code path a locally-stood-up FieryPit uses — there is no
# separate "join" step and nothing on the Dis side drives this host's
# lifecycle. This is the deliberate difference from docker-compose.yml's
# own `lildaemon` service, which is one participant IN a stack that also
# runs Kafka + clara-api; this file assumes those already exist elsewhere
# and only stands up the participant.
#
# Usage, on the remote host (e.g. pineal), from a checkout whose directory
# structure matches this one (Development/{lildaemon,clara-cerebellum}/):
#   cd clara-cerebellum/docker
#   cp remote-fierypit.env.example remote-fierypit.env   # fill in real values
#   docker compose -f docker-compose.remote-fierypit.yml \
#     --env-file remote-fierypit.env up -d
#
# Left running (restart: unless-stopped) — this is a standing deployment,
# not a one-shot test harness. Compare lildaemon/scripts/
# check_remote_fierypit.sh, which only verifies an already-running
# instance like this one is visible to Dis; it does not start one.

services:
  lildaemon:
    build:
      context: ../..
      dockerfile: clara-cerebellum/docker/Dockerfile.lildaemon
    image: lildaemon:latest
    ports:
      # Unlike docker-compose.yml's own lildaemon (127.0.0.1-bound, since
      # only same-host processes need it there), this MUST be reachable
      # from the Dis host and any other FieryPit peer on the LAN — bound
      # to all interfaces, access control is host firewall only (ufw),
      # matching the same posture already chosen for Kafka's external
      # listener (docker-compose.yml's kafka service comment).
      - "0.0.0.0:${LILDAEMON_PORT:-6666}:6666"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Dis (clara-api) on the remote host this FieryPit is joining —
      # e.g. http://limbic:8080 or http://10.0.0.192:8080. No sensible
      # default; required.
      - CEREBELLUM_URL=${DIS_BASE_URL:?set DIS_BASE_URL to the Dis host's address, e.g. http://limbic:8080}
      - DIS_BASE_URL=${DIS_BASE_URL:?set DIS_BASE_URL to the Dis host's address, e.g. http://limbic:8080}
      - LILDAEMON_JWT_SECRET=${LILDAEMON_JWT_SECRET:?set LILDAEMON_JWT_SECRET}
      # THIS host's own address, as reachable from Dis and other peers —
      # e.g. http://pineal:6666. Not "localhost"/"lildaemon": those only
      # resolve on this host / this compose project's own network. This
      # is what gets pushed as `base_url` in this FieryPit's own
      # registration (PUT /fierypits/{id}), so getting it wrong means
      # Dis advertises an address nobody else can actually reach.
      - LILDAEMON_BASE_URL=${LILDAEMON_BASE_URL:?set LILDAEMON_BASE_URL to this host's own reachable address, e.g. http://pineal:6666}
      - LILDAEMON_DB_PATH=/app/data/lildaemon.duc
      - LILDAEMON_OUTPUT_DIR=/app/output
      # See docker-compose.yml's identical comment — same per-instance
      # workspace-isolation mechanism, this host's own local disk.
      - PYTHON_TOOLS_WORKSPACE=/app/workspace
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # This host's own Ollama — the whole point of this file existing is
      # to lend ITS OWN GPU/Ollama to Rituals, not to proxy back to
      # wherever Dis lives.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Shared secret gating this FieryPit's own POST /auth/service-token
      # (used when Dis bootstraps a Ritual participant via POST /ritual).
      # Must match LILDAEMON_SERVICE_SECRET on the Dis host.
      - LILDAEMON_SERVICE_SECRET=${LILDAEMON_SERVICE_SECRET:?set LILDAEMON_SERVICE_SECRET, must match the Dis host's value}
      # Shared secret for cross-FieryPit POST /ritual/join AND this
      # FieryPit's own registration/heartbeat with Dis (PUT/DELETE
      # /fierypits/{id}) — see docs/fierypit_registration_plan.md. Must
      # match DIS_DOMAIN_PEER_TOKEN on the Dis host and every other
      # FieryPit under the same Dis domain.
      - DIS_DOMAIN_PEER_TOKEN=${DIS_DOMAIN_PEER_TOKEN:?set DIS_DOMAIN_PEER_TOKEN, must match the Dis host's value}
      # Must match the Dis host's configured server.dis_domain_id (config/
      # default.toml) by convention — not validated anywhere.
      - DIS_DOMAIN=${DIS_DOMAIN:-dis.local}
      - FIERYPIT_HEARTBEAT_INTERVAL_SECONDS=${FIERYPIT_HEARTBEAT_INTERVAL_SECONDS:-30}
      - GOOGLE_CUSTOM_SEARCH_API_KEY=${GOOGLE_CUSTOM_SEARCH_API_KEY:-}
      - GOOGLE_CUSTOM_SEARCH_CX=${GOOGLE_CUSTOM_SEARCH_CX:-}
      # Edgequake RAG API — optional; only needed if this FieryPit hosts
      # an evaluator that uses the `edgequake` tool or a cow/edgequakeingest
      # Ritual seat. Leave unset if this host is only lending a plain
      # local-model evaluator to Rituals.
      - EDGEQUAKE_BASE_URL=${EDGEQUAKE_BASE_URL:-}
      - EDGEQUAKE_API_KEY=${EDGEQUAKE_API_KEY:-}
      - EDGEQUAKE_DEFAULT_TENANT=${EDGEQUAKE_DEFAULT_TENANT:-}
      - EDGEQUAKE_DEFAULT_WORKSPACE=${EDGEQUAKE_DEFAULT_WORKSPACE:-}
    volumes:
      - ../lildaemon/data:/app/data
      - ../lildaemon/output:/app/output
      - ../lildaemon/workspace:/app/workspace
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6666/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
